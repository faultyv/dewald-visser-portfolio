backend:
  name: github
  repo: faultyv/dewald-visser-portfolio
  branch: main
  squash_merges: true
  commit_messages:
    create: "cms: create {{collection}} {{slug}}"
    update: "cms: update {{collection}} {{slug}}"
    delete: "cms: delete {{collection}} {{slug}}"
    uploadMedia: "cms: upload {{path}}"
    deleteMedia: "cms: delete {{path}}"

# For a friendlier "Sign in with GitHub" button later, deploy Sveltia CMS
# Authenticator to Cloudflare Workers and add:
#   base_url: https://YOUR-WORKER.workers.dev
#
# For now, use Sveltia's built-in "Sign in with Token" flow. It is immediate,
# free and does not require storing any secret in this repository.

site_url: https://dewald-visser-portfolio.vercel.app
display_url: https://dewald-visser-portfolio.vercel.app
app_title: Dewald Visser · Portfolio Studio
logo:
  src: /icon

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: site_settings
    label: Site Settings
    files:
      - name: site
        label: Main Site Copy
        file: content/site.json
        format: json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Role, name: role, widget: string }
          - { label: Location, name: location, widget: string }
          - label: Languages
            name: languages
            widget: list
            field: { label: Language, name: language, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Availability, name: availability, widget: string }
          - label: Hero Tags
            name: tags
            widget: list
            field: { label: Tag, name: tag, widget: string }
          - { label: Hero Positioning, name: heroPosition, widget: text }
          - { label: About Headline, name: aboutHeadline, widget: text }
          - { label: About Body, name: aboutBody, widget: text }
          - label: About Media
            name: media
            widget: object
            fields:
              - { label: About Image, name: aboutImage, widget: image, required: false }
              - { label: About Image Alt Text, name: aboutImageAlt, widget: string }
              - { label: About Image Caption, name: aboutImageCaption, widget: string }
              - { label: System Image, name: systemImage, widget: image, required: false }
              - { label: System Image Alt Text, name: systemImageAlt, widget: string }
              - { label: System Image Caption, name: systemImageCaption, widget: string }
              - label: Proof Images
                name: proofImages
                widget: list
                required: false
                fields:
                  - { label: Image, name: src, widget: image }
                  - { label: Alt Text, name: alt, widget: string }
                  - { label: Label, name: label, widget: string }
                  - { label: Caption, name: caption, widget: string }
                  - { label: Object Position, name: focus, widget: string, required: false, hint: "Optional CSS object-position, for example center 45%." }
          - label: Stats
            name: stats
            widget: list
            fields:
              - { label: Value, name: value, widget: number, value_type: int }
              - { label: Suffix, name: suffix, widget: string, required: false }
              - { label: Label, name: label, widget: string }
          - label: Building With
            name: buildingWith
            widget: list
            field: { label: Tool, name: tool, widget: string }
          - label: Social Links
            name: socials
            widget: object
            fields:
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - { label: Behance, name: behance, widget: string, required: false }
              - { label: Instagram, name: instagram, widget: string, required: false }
              - { label: X, name: x, widget: string, required: false }
              - { label: Website, name: website, widget: string, required: false }
              - { label: WhatsApp Legacy URL, name: whatsapp, widget: string, required: false }
          - label: WhatsApp
            name: whatsapp
            widget: object
            fields:
              - { label: Number, name: number, widget: string, required: false, hint: "Use international format, e.g. +27678952710" }
              - { label: Message, name: message, widget: text, required: false }
          - { label: Education, name: education, widget: string }

      - name: certs
        label: Credentials
        file: content/certs.json
        format: json
        fields:
          - label: Featured Certificates
            name: featured
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Issuer, name: issuer, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Verify URL, name: verify, widget: string, required: false }
              - label: Colour
                name: seed
                widget: select
                options: [primary, secondary, tertiary, success, warning, info, accent, highlight]
          - label: Additional Certificates
            name: additional
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Issuer, name: issuer, widget: string }

  - name: projects
    label: Portfolio projects
    label_singular: Project
    folder: content/projects
    create: true
    delete: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    summary: "{{title}} · {{org}}"
    preview_path: work/{{slug}}
    sortable_fields:
      fields: [order, title, org, period]
      default: { field: order, direction: ascending }
    view_groups:
      - { label: Client / organisation, field: org }
      - { label: Discipline, field: categories }
    view_filters:
      - label: SEO & marketing
        field: categories
        pattern: marketing
      - label: Web & digital
        field: categories
        pattern: web
      - label: Graphic & brand
        field: categories
        pattern: brand
      - { label: Freelance projects, field: categories, pattern: freelance }
    fields:
      - { label: Project title, name: title, widget: string, hint: "A clear client or project name. Keep this short for the work cards." }
      - { label: Organisation, name: org, widget: string }
      - { label: Period, name: period, widget: string }
      - label: Disciplines & collection
        name: categories
        widget: select
        multiple: true
        hint: "Choose every relevant discipline. Add Freelance for independent client projects; this does not add an employment role."
        options:
          - { label: Graphic & brand design, value: brand }
          - { label: Web & digital, value: web }
          - { label: SEO & marketing, value: marketing }
          - { label: Freelance project, value: freelance }
      - { label: Main contribution, name: label, widget: string, hint: "A short description such as SEO · Graphic & Web Design. This appears above the project title." }
      - { label: Tools / skills summary, name: tools, widget: string }
      - { label: Project summary, name: outcome, widget: text, hint: "One or two sentences describing your actual contribution. Credit collaborators and avoid unverified results." }
      - label: Colour
        name: seed
        widget: select
        options: [primary, secondary, tertiary, success, warning, info, accent, highlight]
      - { label: Project hero artwork, name: cover, widget: image, required: false, hint: "The complete artwork shown inside the project. Choose an existing asset to avoid uploading it twice." }
      - { label: Work-page thumbnail, name: thumbnail, widget: image, required: false, hint: "Optional separate card image. Leave empty to use the hero artwork. Every thumbnail is shown uncropped." }
      - { label: Thumbnail description, name: thumbnailAlt, widget: string, required: false, hint: "Describe what the image shows for screen readers, e.g. Webmeta agency logo." }
      - label: Thumbnail presentation
        name: thumbnailStyle
        widget: select
        required: false
        default: artwork
        options:
          - { label: Full artwork — no cropping, value: artwork }
          - { label: Logo — framed with breathing room, value: logo }
      - label: Thumbnail canvas
        name: coverBg
        widget: select
        required: false
        hint: "Choose a canvas that suits transparent artwork. Leave empty for the site background."
        options:
          - { label: White, value: light }
          - { label: Dark blue, value: dark }
      # Preserve legacy metadata without presenting cropping controls.
      - { name: coverFit, widget: hidden }
      - { name: coverPosition, widget: hidden }
      - { label: Display order, name: order, widget: number, value_type: float, default: 50, hint: "Lower numbers appear first. Decimals let you insert a project between existing entries." }
      - label: Metrics
        name: metrics
        widget: list
        collapsed: true
        default: []
        summary: "{{fields.value}} · {{fields.label}}"
        fields:
          - { label: Value, name: value, widget: string }
          - { label: Label, name: label, widget: string }
      - label: Stack
        name: stack
        widget: list
        field: { label: Tool, name: tool, widget: string }
      - label: Brands Worked On
        name: brands
        widget: list
        required: false
        field: { label: Brand, name: brand, widget: string }
      - label: Complete artwork gallery
        name: gallery
        widget: list
        required: false
        default: []
        collapsed: true
        summary: "{{fields.label}}"
        hint: "Keep all distinct artwork. Reuse existing images, give each a useful caption, and drag to arrange the gallery. Groups become visitor filters."
        fields:
          - { label: ID, name: id, widget: string, hint: "Example: g1, g2, g3" }
          - { label: Caption, name: label, widget: string }
          - { label: Gallery group, name: group, widget: string, required: false, hint: "For example Brand identity, Website context, or Campaign artwork." }
          - { label: Image, name: src, widget: image, required: false }
      - label: Publications & PDFs
        name: documents
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.title}} · {{fields.pages}} pages"
        hint: "Listed automatically in the PDF library and inside the project. Keep one entry per publication; use download parts for large PDFs on slow connections."
        fields:
          - { label: Publication title, name: title, widget: string }
          - { label: PDF file or URL, name: url, widget: file }
          - { label: Cover preview, name: preview, widget: image }
          - { label: Page count, name: pages, widget: number, value_type: int, min: 1 }
          - { label: File size, name: size, widget: string, hint: "For example 2.2 MB" }
          - label: Smaller download parts
            name: parts
            widget: list
            required: false
            collapsed: true
            summary: "{{fields.label}}"
            fields:
              - { label: Part & page range, name: label, widget: string }
              - { label: PDF file or URL, name: url, widget: file }
              - { label: File size, name: size, widget: string }
      - { label: Featured video URL, name: video, widget: string, required: false, hint: "YouTube URL or an existing /videos/... file. Videos load only when a visitor plays them." }
      - label: Video collection
        name: videos
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.title}}"
        fields:
          - { label: Video title, name: title, widget: string }
          - { label: Video URL, name: url, widget: string }
          - { label: Your contribution, name: role, widget: text, required: false }
      - label: Your responsibilities
        name: responsibilities
        widget: list
        required: false
        collapsed: true
        field: { label: Contribution, name: contribution, widget: string }
      - label: Proof Media Links
        name: proofLinks
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - label: Platform
            name: platform
            widget: select
            required: false
            options: [YouTube, Facebook, Behance, Website, Live site]
          - { label: Context, name: context, widget: text, required: false }
          - { label: URL, name: url, widget: string }
      - label: Links
        name: links
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: URL, name: url, widget: string }
      - { label: Body, name: body, widget: markdown }

  - name: career
    label: Career Timeline
    files:
      - name: cv
        label: Roles
        file: content/cv.json
        format: json
        fields:
          - label: Roles
            name: roles
            widget: list
            root: true
            summary: "{{fields.role}} · {{fields.org}}"
            fields:
              - { label: Date, name: date, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Organisation, name: org, widget: string }
              - { label: Brand Mark, name: brandMark, widget: string, required: false }
              - label: Brand Colour
                name: brandColor
                widget: select
                required: false
                options: [primary, secondary, tertiary, success, warning, info, accent, highlight]
              - label: Tags
                name: tags
                widget: list
                field: { label: Tag, name: tag, widget: string }
              - { label: Detail, name: detail, widget: text }
              - label: Software
                name: software
                widget: list
                required: false
                field: { label: Tool, name: tool, widget: string }
              - label: Role Evidence
                name: proof
                widget: list
                required: false
                fields:
                  - { label: Type, name: type, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Detail, name: detail, widget: text }

  - name: companies
    label: Brand Map
    files:
      - name: companies
        label: Companies
        file: content/companies.json
        format: json
        fields:
          - label: Companies
            name: companies
            widget: list
            root: true
            summary: "{{fields.name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Mark, name: mark, widget: string }
              - label: Colour
                name: seed
                widget: select
                options: [primary, secondary, tertiary, success, warning, info, accent, highlight]
              - { label: Relationship, name: relationship, widget: string }
              - { label: Discipline, name: discipline, widget: text }
              - { label: Period, name: period, widget: string }
              - { label: Website URL, name: url, widget: string, required: false }
              - label: Social Links
                name: socials
                widget: list
                required: false
                fields:
                  - label: Kind
                    name: kind
                    widget: select
                    options: [instagram, facebook]
                  - { label: URL, name: url, widget: string }

  - name: capability_data
    label: Capability Data
    files:
      - name: skills
        label: Skills
        file: content/skills.json
        format: json
        fields:
          - label: Skill Columns
            name: skills
            widget: list
            root: true
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - label: Colour
                name: seed
                widget: select
                options: [primary, secondary, tertiary, success, warning, info, accent, highlight]
              - label: Items
                name: items
                widget: list
                field: { label: Item, name: item, widget: string }

      - name: method
        label: Operating Method
        file: content/method.json
        format: json
        fields:
          - label: Steps
            name: steps
            widget: list
            root: true
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Kicker, name: kicker, widget: string }
              - label: Colour
                name: seed
                widget: select
                options: [primary, secondary, tertiary, success, warning, info, accent, highlight]
              - { label: Body, name: body, widget: text }

      - name: marquee
        label: Marquee Tools
        file: content/marquee.json
        format: json
        fields:
          - label: Tools
            name: tools
            widget: list
            root: true
            field: { label: Tool, name: tool, widget: string }
